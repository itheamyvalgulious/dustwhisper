[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oracle-game"
version = "0.1.0"
description = "Core world engine prototype for Dustwhisper"
requires-python = ">=3.12"
dependencies = [
  "moderngl>=5.10",
  "moderngl-window>=3.1",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.15.22",
]

[project.scripts]
enginedemo = "oracle_game.enginedemo:main"

[tool.setuptools.packages.find]
include = ["oracle_game*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["oracle_game"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: test requires a GPU ModernGL context (GL >= 4.3)",
]

